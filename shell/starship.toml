add_newline = true
command_timeout = 1200

format = "$directory$git_branch$git_status$nodejs$python$rust$java$cmd_duration$line_break$character"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = "git:"
style = "bold purple"

[git_status]
style = "yellow"

[cmd_duration]
min_time = 800
format = " [$duration](dimmed white)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
