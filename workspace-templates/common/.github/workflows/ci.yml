name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ "{{runtime}}" = "bun" ]; then
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          else
            corepack enable
          fi
      - run: "{{runtimeInstallCommand}}"
      - run: "{{runtimeCommandPrefix}} format:check"
      - run: "{{runtimeCommandPrefix}} lint"
      - run: "{{runtimeCommandPrefix}} typecheck"
      - run: "{{runtimeCommandPrefix}} test"
      - run: "{{runtimeCommandPrefix}} build"
